<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCraft - Cadastro</title>
    <link rel="stylesheet" href="Login.css">
    <link rel="icon" href="../assets/logo.png" type="image/png">
</head>

<body data-pcraft-page="auth">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="../Home page/index.html" class="logo"><span class="logo-c">PC</span>RAFT<span
                    class="logo-dot"></span></a>

            <ul class="nav-links">
                <li><a href="../Home page/index.html">Início</a></li>
                <li><a href="../Montagem/index.html">Montagem</a></li>
                <li><a href="../Tutorial/index.html">Tutorial</a></li>
                <li><a href="../Builds/BuildsUsuarios.html">Builds dos Usuários</a></li>
                <li data-pcraft-user-only hidden><a href="../Builds/MinhasBuilds.html">Minhas Builds</a></li>
                <li data-pcraft-admin-only hidden><a href="../Adm/Adm.html">Painel Admin</a></li>
            </ul>

            <div class="nav-actions"></div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">

            <h1><span class="logo-c">PC</span>RAFT<span class="logo-dot"></span></h1>
            <p class="subtitle">Criar conta</p>

            <form id="formCadastro">
                <label>Nome</label>
                <input type="text" id="cadastroNome" placeholder="Digite seu nome" required>

                <label>Email</label>
                <input type="email" id="cadastroEmail" placeholder="Digite seu email" required>

                <label>Senha</label>
                <input type="password" id="cadastroSenha" placeholder="Crie uma senha" required>

                <label>Confirmar senha</label>
                <input type="password" id="cadastroConfirmarSenha" placeholder="Confirme a senha" required>

                <button type="submit">Cadastrar</button>
            </form>
            <p id="authMessage" class="auth-message"></p>

            <div class="register">
                <p>Já tem uma conta?</p>
                <a href="Login.html">Voltar para login</a>
            </div>

        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PCraft — Verificador de compatibilidade</p>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>

</html>
