<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCraft - Cadastro</title>

    <link rel="stylesheet" href="Login.css">

</head>

<body>

    <div class="login-box">

        <h1>PCraft</h1>
        <p class="subtitle">Criar conta</p>

        <form id="formCadastro">
            <label>Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>

            <label>Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>

            <label>Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Confirme a senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        </form>

        <div class="register">
            <p>Já tem uma conta?</p>
            <a href="login.html">Voltar para login</a>
        </div>

    </div>
    <script src="../Montagem/app.js"></script>
</body>
</html>
