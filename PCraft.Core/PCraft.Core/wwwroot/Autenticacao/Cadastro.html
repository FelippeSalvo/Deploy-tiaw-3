<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCraft - Cadastro</title>
    <link rel="stylesheet" href="Login.css">
</head>

<body data-pcraft-page="auth">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="../Home page/index.html" class="logo">PCraft</a>

            <div class="nav-actions"></div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">

            <h1>PCraft</h1>
            <p class="subtitle">Criar conta</p>

            <form id="formCadastro">
                <label>Nome</label>
                <input type="text" id="cadastroNome" placeholder="Digite seu nome" required>

                <label>Email</label>
                <input type="email" id="cadastroEmail" placeholder="Digite seu email" required>

                <label>Senha</label>
                <input type="password" id="cadastroSenha" placeholder="Crie uma senha" required>

                <label>Confirmar senha</label>
                <input type="password" id="cadastroConfirmarSenha" placeholder="Confirme a senha" required>

                <button type="submit">Cadastrar</button>
            </form>
            <p id="authMessage" class="auth-message"></p>

            <div class="register">
                <p>Já tem uma conta?</p>
                <a href="Login.html">Voltar para login</a>
            </div>

        </div>
    </div>

    <footer class="footer footer--compact">
        <div class="container footer-content">
            <div>
                <h3>PCraft</h3>
                <p class="footer-tagline">Montagem com compatibilidade inteligente</p>
                <p class="footer-auth-status" aria-live="polite"></p>
            </div>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
