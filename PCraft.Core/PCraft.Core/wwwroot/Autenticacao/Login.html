<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCraft - Login</title>
    <link rel="stylesheet" href="Login.css">
    <link rel="icon" href="../assets/logo.png" type="image/png">
</head>

<body data-pcraft-page="auth">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="../Home page/index.html" class="logo"><span class="logo-c">PC</span>RAFT<span class="logo-dot"></span></a>

            <ul class="nav-links">
                <li><a href="../Home page/index.html">Início</a></li>
                <li><a href="../Montagem/index.html">Montagem</a></li>
                <li><a href="../Builds/BuildsUsuarios.html">Builds dos Usuários</a></li>
                <li data-pcraft-user-only hidden><a href="../Builds/MinhasBuilds.html">Minhas Builds</a></li>
                <li data-pcraft-admin-only hidden><a href="../Adm/Adm.html">Painel Admin</a></li>
            </ul>

            <div class="nav-actions"></div>
        </div>
    </nav>

    <div class="login-container">

        <div class="login-box">

            <h1>PCraft</h1>
            <p class="subtitle">Monte seu PC</p>

            <form id="formLogin">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Digite seu email" required>

                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha" required>

                <button type="submit">Entrar</button>
            </form>

            <p id="authMessage" class="auth-message"></p>

            <div class="extra-links">
                <a href="../Recuperacao/RecuperarSenha.html">Esqueci minha senha</a>
            </div>

            <div class="register">
                <p>Não tem uma conta?</p>
                <a href="Cadastro.html">Criar conta</a>
            </div>

        </div>

    </div>

    <footer class="footer footer--compact">
        <div class="container footer-content">
            <div>
                <h3>PCraft</h3>
                <p class="footer-tagline">Montagem com compatibilidade inteligente</p>
                <p class="footer-auth-status" aria-live="polite"></p>
            </div>
        </div>
    </footer>

    <script src="auth.js"></script>
</body>

</html>
