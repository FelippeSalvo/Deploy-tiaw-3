<!DOCTYPE html>
<html lang="pt-BR">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCraft - Login</title>
    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="../Home page/index.html" class="logo">PCraft</a>

            <div class="nav-actions">
                <a href="../Home page/index.html" class="btn-cadastro">Home</a>
                <a href="Cadastro.html" class="btn-login">Cadastro</a>
            </div>
        </div>
    </nav>

    <div class="login-container">

        <div class="login-box">

            <h1>PCraft</h1>
            <p class="subtitle">Monte seu PC</p>

            <form id="formLogin">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Digite seu email" required>

                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha" required>

                <button type="submit">Entrar</button>
            </form>

            <div class="register">
                <p>Não tem uma conta?</p>
                <a href="Cadastro.html">Criar conta</a>
            </div>

        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
