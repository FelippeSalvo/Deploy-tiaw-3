<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCraft - Minhas Builds</title>
    <link rel="stylesheet" href="builds.css">
    <link rel="icon" href="../assets/logo.png" type="image/png">
</head>

<body data-pcraft-page="builds" data-builds-view="mine">
    <nav class="navbar">
        <div class="container nav-content">
            <a href="../Home page/index.html" class="logo"><span class="logo-c">PC</span>RAFT<span class="logo-dot"></span></a>

            <ul class="nav-links">
                <li><a href="../Home page/index.html">Início</a></li>
                <li><a href="../Montagem/index.html">Montagem</a></li>
                <li><a href="../Builds/BuildsUsuarios.html">Builds dos Usuários</a></li>
                <li data-pcraft-user-only hidden><a href="../Builds/MinhasBuilds.html" class="active">Minhas Builds</a>
                </li>
                <li data-pcraft-admin-only hidden><a href="../Adm/Adm.html">Painel Admin</a></li>
            </ul>

            <div class="nav-actions"></div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <header class="page-header">
                <h1>Minhas Builds</h1>
                <p>Gerencie suas configurações salvas.</p>
            </header>

            <section id="builds-list" class="builds-grid">
                <div class="loading-state">Carregando builds...</div>
            </section>
        </div>
    </main>



    <div id="edit-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-build-title">
            <div class="modal-header">
                <h2 id="edit-build-title">Editar Build</h2>
                <button id="edit-modal-close" class="modal-close" type="button" aria-label="Fechar">✕</button>
            </div>
            <div class="modal-content">
                <label class="field-label" for="edit-build-name">Nome</label>
                <input id="edit-build-name" class="field-input" type="text" maxlength="80" />

                <label class="field-label" for="edit-build-desc">Descrição</label>
                <input id="edit-build-desc" class="field-input" type="text" maxlength="255" />


                <label class="field-checkbox">
                    <input id="edit-build-shared" type="checkbox" />
                    <span>Compartilhar publicamente</span>
                </label>

                <div class="modal-actions">
                    <button id="edit-cancel" type="button" class="btn-secondary">Cancelar</button>
                    <button id="edit-save" type="button" class="btn-primary">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-message" class="toast-message" aria-live="polite"></div>

    <script src="../Autenticacao/auth.js"></script>
    <script src="builds.js"></script>
</body>

</html>
