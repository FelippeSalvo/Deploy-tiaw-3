<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCraft - Painel do Administrador</title>
  <link rel="stylesheet" href="Adm.css" />
</head>

<body data-pcraft-page="adm">
  <nav class="navbar">
    <div class="container nav-content">
      <a href="../Home page/index.html" class="logo"><span class="logo-c">PC</span>RAFT<span class="logo-dot"></span></a>
      <ul class="nav-links">
        <li><a href="../Home page/index.html" class="active">Início</a></li>
        <li><a href="../Montagem/index.html">Montagem</a></li>
        <li><a href="../Builds/BuildsUsuarios.html">Builds dos Usuários</a></li>
        <li data-pcraft-user-only hidden><a href="../Builds/MinhasBuilds.html">Minhas Builds</a></li>
        <li data-pcraft-admin-only hidden><a href="../Adm/Adm.html">Painel Admin</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="card">
      <h1 class="logo">PCraft</h1>
      <p class="subtitle">Painel do Administrador</p>

      <form id="pecaForm" class="form">
        <div class="form-group">
          <label for="tipo">Tipo da peça</label>
          <select id="tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="GPU">Placa de Vídeo</option>
            <option value="RAM">Memória RAM</option>
            <option value="CPU">Processador</option>
            <option value="Motherboard">Placa-mãe</option>
            <option value="PSU">Fonte</option>
          </select>
        </div>

        <div id="camposDinamicos"></div>

        <button type="submit" class="btn-primary">Adicionar peça</button>
      </form>

      <div class="toolbar">
        <div class="form-group">
          <label for="busca">Buscar peças</label>
          <input type="text" id="busca" placeholder="Buscar por nome ou detalhes" />
        </div>

        <div class="form-group">
          <label for="filtroTipo">Filtrar por tipo</label>
          <select id="filtroTipo">
            <option value="">Todos os tipos</option>
            <option value="Placa de Vídeo">Placa de Vídeo</option>
            <option value="Memória RAM">Memória RAM</option>
            <option value="Processador">Processador</option>
            <option value="Placa-mãe">Placa-mãe</option>
            <option value="Fonte">Fonte</option>
          </select>
        </div>
      </div>

      <div class="list-header">
        <h2>Lista de peças</h2>
        <span id="totalPecas">0 peça(s)</span>
      </div>

      <div id="listaPecas" class="pecas-list"></div>

      <p class="footer-text">
        PCraft
      </p>
    </div>
  </div>

  <footer class="footer adm-site-footer">
    <div class="container footer-content">
      <div>
        <h3>PCraft</h3>
        <p class="footer-tagline">Painel administrativo</p>
        <p class="footer-auth-status" aria-live="polite"></p>
      </div>
      <div class="footer-links">
        <a href="../Home page/index.html">Início</a>
        <a href="../Montagem/index.html">Montagem</a>
        <a href="../Builds/BuildsUsuarios.html">Builds dos Usuários</a>
        <a href="../Builds/MinhasBuilds.html" data-pcraft-user-only hidden>Minhas Builds</a>
        <a href="../Autenticacao/Login.html" data-pcraft-guest-only>Login</a>
      </div>
    </div>
  </footer>

  <script src="../Autenticacao/auth.js"></script>
  <script src="Adm.js"></script>
</body>

</html>
